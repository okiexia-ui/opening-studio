name: Build macOS release artifacts
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    # Keep the macOS fonts for the browser suite. Hosted arm64 jobs can expire
    # before a runner is assigned. Apple Silicon is exercised on the local Mac.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consistency and renderer checks
        run: npm run check
  macos:
    # Validate the universal binary on Intel; local GUI tests use Apple Silicon.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - name: Build universal app
        run: zsh scripts/build-native.sh --universal
      - name: Verify signature and architectures
        run: |
          codesign --verify --deep --strict 'delivery/Welcome Tommy.app'
          lipo -archs 'delivery/Welcome Tommy.app/Contents/MacOS/WelcomeTommy'
      - name: Lint shell scripts
        run: for f in scripts/*.sh delivery/*.command *.command; do zsh -n "$f"; done
      - name: Exercise installation and rollback in an isolated Library
        run: python3 scripts/test-install.py
      - name: Package release
        run: python3 scripts/package-release.py
      - uses: actions/upload-artifact@v7
        with:
          name: OpeningStudio-macos
          path: |
            release/*.zip
            release/SHA256SUMS.txt
            release/manifest.json
          if-no-files-found: error
